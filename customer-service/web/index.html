<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuse examples: customer service</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F5F8FD; --panel: #FFFFFF; --hole: #E9F0FA; --line: #D3E2F7;
  --ink: #1C2433; --muted: #5D6675; --blue: #3F6FC4; --blue-soft: #DCE7F8; --on-blue: #FFFFFF;
  --amber: #94650F; --amber-soft: #F6ECD6; --green: #2E7A55; --red: #B8402F;
  --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14171C; --panel: #1B1F26; --hole: #222833; --line: #2C3442;
    --ink: #E6EEF9; --muted: #9AA4B4; --blue: #7EA6E3; --blue-soft: #263650; --on-blue: #10141A;
    --amber: #E2B35C; --amber-soft: #352B19; --green: #7CCB9F; --red: #EE8A78;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--sans); }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
code, .num { font-family: var(--mono); font-size: 13px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px 40px; }

header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 0 6px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
h1 span { color: var(--muted); font-weight: 400; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--blue); }
.btn.go { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn:disabled { opacity: .5; cursor: default; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 10px 0 14px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 14px 10px; cursor: pointer; font-weight: 500; color: var(--muted);
       border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }
.lede { margin: 0 0 18px; color: var(--muted); }
.lede code { color: var(--ink); }

.stage { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
.picks { display: flex; flex-direction: column; gap: 5px; max-height: 62vh; overflow-y: auto; padding: 2px 4px 2px 2px; }
.pick { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 1px solid var(--line);
        background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.pick:hover { border-color: var(--blue); }
.pick.on { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
.pick .lang { color: var(--muted); font-family: var(--mono); font-size: 12px; text-transform: uppercase; }
.own[hidden] { display: none; }
.own { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.own textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); resize: vertical; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; }
.card.empty { color: var(--muted); text-align: center; padding: 60px 24px; }
.step { margin: 0 0 22px; }
.step:last-of-type { margin-bottom: 8px; }
.step h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.msg { margin: 0 0 8px; }
.msg .who { font-size: 13px; color: var(--muted); }
.msg .text { background: var(--hole); border-radius: 10px; padding: 8px 12px; display: inline-block; max-width: 100%; white-space: pre-line; }
.msg.bot .text { background: var(--blue-soft); }
.msg .en { font-size: 13px; color: var(--muted); margin-top: 2px; }

.q { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q .ask { font-size: 14px; }
.q .ask code { color: var(--muted); display: block; font-size: 12px; }
.bar { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; }
.bar .track { display: block; height: 8px; background: var(--hole); border-radius: 4px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width .6s ease-out; }
.bar.dim .fill { background: var(--line); }
.bar .p { text-align: right; font-family: var(--mono); font-size: 12px; }

.decision { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.decision .what { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.decision.person .what { color: var(--amber); }
.decision .why { color: var(--muted); }
.rule { font-size: 13px; color: var(--muted); margin-top: 6px; }
.check { font-size: 13px; margin-top: 6px; }
.check.right { color: var(--green); }
.check.wrong { color: var(--red); }
.check.later { color: var(--amber); }
.reading { color: var(--muted); }

details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 500; }
pre { background: var(--hole); border-radius: 8px; padding: 12px; overflow: auto; max-height: 360px; font: 12px/1.45 var(--mono); }
.cost { font-size: 13px; color: var(--muted); margin-top: 12px; }
.error { color: var(--red); }

@media (max-width: 820px) {
  .stage { grid-template-columns: 1fr; }
  .q { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar .fill { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Zuse examples <span>· customer service</span></h1>
    <button class="btn go" id="play">Play the demo</button>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="lede" id="lede"></p>
  <div class="stage">
    <div>
      <div class="picks" id="picks"></div>
      <div class="own" id="own" hidden>
        <textarea id="ownText" placeholder="Or write your own, in any language"></textarea>
        <button class="btn" id="ownGo">Ask Zuse</button>
      </div>
    </div>
    <div class="card empty" id="card">Pick a sample on the left.</div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p) => (p >= 0.995 && p < 1 ? ">99" : Math.round(p * 100)) + "%";
let DATA, current, playing = false, runId = 0;

async function load() {
  DATA = await (await fetch("/api/examples")).json();
  $("tabs").innerHTML = DATA.examples.map((e, i) =>
    `<button class="tab" role="tab" data-i="${i}">${esc(e.title)}</button>`).join("");
  $("tabs").onclick = (ev) => { const b = ev.target.closest(".tab"); if (b) { stop(); open(+b.dataset.i); } };
  open(0);
}

function open(i) {
  current = DATA.examples[i];
  document.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", i === j));
  $("lede").innerHTML = `${esc(current.lede)} The code is in <code>${esc(current.file)}</code>.`;
  $("picks").innerHTML = current.samples.map((s) =>
    `<button class="pick" data-id="${esc(s.id)}"><span>${esc(s.title)}</span><span class="lang">${esc(s.lang || "")}</span></button>`).join("");
  $("picks").onclick = (ev) => { const b = ev.target.closest(".pick"); if (b) { stop(); run({ id: b.dataset.id }); } };
  $("own").hidden = !current.own;
  $("card").className = "card empty";
  $("card").textContent = "Pick a sample on the left.";
}

function messages(show) {
  return show.map((m) => `<div class="msg ${m.who === "Bot" ? "bot" : ""}">
      <div class="who">${esc(m.who)}</div><div class="text">${esc(m.text)}</div>
      ${m.en && m.en !== m.text ? `<div class="en">${esc(m.en)}</div>` : ""}</div>`).join("");
}

function bar(label, p, dim) {
  return `<div class="bar ${dim ? "dim" : ""}"><span>${esc(label)}</span>
    <span class="track"><span class="fill" data-w="${(p * 100).toFixed(1)}%" style="width:0"></span></span><span class="p">${pct(p)}</span></div>`;
}

function answers(r) {
  if (!r.response) return `<p class="reading">No call to Zuse: your code decided this on its own.</p>`;
  return Object.entries(current.questions).map(([key, q]) => {
    const a = r.response.answers[key];
    let out;
    if (q.type === "noul") out = bar("Yes", a.noul, a.noul < 0.5);
    else {
      const names = q.criteria;
      out = Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]).slice(0, 3)
        .map(([k, p], j) => bar(k, p, j > 0)).join("");
    }
    return `<div class="q"><div class="ask">${esc(q.instructions)}<code>${esc(key)}</code></div><div>${out}</div></div>`;
  }).join("");
}

function verdict(r) {
  const expect = r.expect == null ? null : [].concat(r.expect);
  let check = "";
  if (expect) {
    if (r.decision === "person" && !expect.includes("person")) check = `<div class="check later">Expected: ${esc(expect.join(" or "))}. Zuse wasn't sure enough, so a person decides.</div>`;
    else if (expect.includes(r.decision)) check = `<div class="check right">As expected.</div>`;
    else check = `<div class="check wrong">Expected: ${esc(expect.join(" or "))}.</div>`;
  }
  return `<div class="decision ${r.decision === "person" ? "person" : ""}"><span class="what">${esc(r.label)}</span>
      <span class="why">${esc(r.reason)}</span></div>
    <div class="rule">Your rule in <code>${esc(current.file)}</code>: ${esc(current.rule)}</div>${check}`;
}

async function run(body) {
  const my = ++runId, ex = current, sample = body.id ? ex.samples.find((s) => s.id === body.id) : null;
  document.querySelectorAll(".pick").forEach((p) => p.classList.toggle("on", !!sample && p.dataset.id === sample.id));
  document.querySelector(".pick.on")?.scrollIntoView({ block: "nearest" });
  const show = sample ? sample.show : [{ who: "Customer", text: body.text }];
  const card = $("card");
  card.className = "card";
  card.innerHTML = `<section class="step"><h2>1 · What Zuse reads</h2>${messages(show)}</section>
    <section class="step"><h2>2 · What Zuse is asked, and its answers</h2><p class="reading">Asking Zuse...</p></section>`;
  let r;
  try {
    const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json", "X-Zuse-Example": "1" },
      body: JSON.stringify({ example: ex.key, ...body }) });
    r = await res.json();
    if (!res.ok) throw new Error(r.error || res.statusText);
  } catch (e) {
    if (my === runId) card.querySelector(".reading").outerHTML = `<p class="error">${esc(e.message)}</p>`;
    return;
  }
  if (my !== runId || ex !== current) return;
  const usage = r.response ? `${r.tokens.toLocaleString()} input tokens, $${(r.tokens * DATA.price / 1e6).toFixed(5)}` +
    (r.response.latency_ms ? `, ${Math.round(r.response.latency_ms)} ms` : "") : "No tokens: decided in code.";
  card.innerHTML = `<section class="step"><h2>1 · What Zuse reads</h2>${messages(show)}</section>
    <section class="step"><h2>2 · What Zuse is asked, and its answers</h2>${answers(r)}</section>
    <section class="step"><h2>3 · The decision</h2>${verdict(r)}</section>
    <div class="cost">${usage} · ${esc(DATA.model)}</div>
    ${r.request ? `<details><summary>Show the API call</summary>
      <p>POST https://api.bineric.com/v1/zuse</p><pre>${esc(JSON.stringify(r.request, null, 2))}</pre>
      <p>Response</p><pre>${esc(JSON.stringify(r.response, null, 2))}</pre></details>` : ""}`;
  requestAnimationFrame(() => requestAnimationFrame(() =>       // grow the bars in
    card.querySelectorAll(".fill").forEach((f) => { f.style.width = f.dataset.w; })));
}

$("ownGo").onclick = () => { const t = $("ownText").value.trim(); if (t) { stop(); run({ text: t }); } };

// The demo: two samples on every tab.
const DEMO = { routing: ["T01", "T39"], handover: ["H3", "H4"], quality: ["Q2", "Q3"], refunds: ["R3", "R6"], feedback: ["F2", "F13"] };
const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
function stop() { playing = false; $("play").textContent = "Play the demo"; }
$("play").onclick = async () => {
  if (playing) return stop();
  playing = true; $("play").textContent = "Stop";
  for (let i = 0; i < DATA.examples.length && playing; i++) {
    open(i);
    const ex = DATA.examples[i], ids = DEMO[ex.key] || [];
    for (const s of ex.samples.filter((x) => ids.includes(x.id))) {
      if (!playing) return;
      await wait(700);
      if (!playing) return;
      await run({ id: s.id });
      await wait(3200);
    }
  }
  stop();
};
load();
</script>
</body>
</html>
